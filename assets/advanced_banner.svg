<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="600" fill="url(#grad1)" />
  
  <!-- Central Node -->
  <rect x="500" y="250" width="200" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
  <text x="600" y="305" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#38bdf8">API GATEWAY</text>
  
  <!-- Surrounding Nodes -->
  <g>
    <!-- Auth Service -->
    <line x1="600" y1="250" x2="400" y2="150" stroke="#475569" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="300" y="100" width="150" height="60" rx="5" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="375" y="135" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#818cf8">AUTH SERVICE</text>
    
    <!-- Prisma/DB -->
    <line x1="600" y1="350" x2="600" y2="450" stroke="#475569" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="525" y="450" width="150" height="60" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="600" y="485" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#10b981">PRISMA + MONGO</text>
    
    <!-- Redis -->
    <line x1="700" y1="300" x2="850" y2="300" stroke="#475569" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="850" y="270" width="150" height="60" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <text x="925" y="305" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ef4444">REDIS CACHE</text>
    
    <!-- Cloudinary -->
    <line x1="500" y1="300" x2="350" y2="300" stroke="#475569" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="200" y="270" width="150" height="60" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="275" y="305" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#f59e0b">CLOUDINARY</text>
  </g>
  
  <text x="50%" y="50" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#f8fafc">SYSTEM ARCHITECTURE</text>
  <text x="50%" y="560" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748b">SCALABLE • MODULAR • SECURE</text>
</svg>
