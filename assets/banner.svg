<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#grad1)" />
  <circle cx="1000" cy="100" r="150" fill="#334155" opacity="0.3" />
  <circle cx="100" cy="300" r="100" fill="#334155" opacity="0.2" />
  
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="url(#grad2)" filter="url(#glow)">
    ADVANCED BACKEND SYSTEM
  </text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
    Node.js • TypeScript • Prisma • Redis • MongoDB
  </text>
  
  <rect x="500" y="280" width="200" height="2" fill="url(#grad2)" opacity="0.5" />
  
  <g opacity="0.1">
    <text x="50" y="50" font-family="monospace" font-size="14" fill="#38bdf8">const express = require('express');</text>
    <text x="50" y="80" font-family="monospace" font-size="14" fill="#38bdf8">const prisma = new PrismaClient();</text>
    <text x="50" y="110" font-family="monospace" font-size="14" fill="#38bdf8">app.use('/api', routes);</text>
    <text x="950" y="300" font-family="monospace" font-size="14" fill="#818cf8">await redis.set(key, value);</text>
    <text x="950" y="330" font-family="monospace" font-size="14" fill="#818cf8">return res.status(200).json(data);</text>
  </g>
</svg>
